<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RECOrion | Otonom Çoklu Ajan & Kolektif Hafıza Platformu</title>
    <meta name="description" content="RECOrion - Kurumsal AI Personelleri, Deterministik İş Akışları ve 2 Kademeli Kolektif Hafıza Platformu" />
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tema: ilk boyamadan önce uygulanır (koyu varsayılan, tercih localStorage'da) -->
    <script>
      (function () {
        var pref = 'dark';
        try { pref = localStorage.getItem('recorion_theme') || 'dark'; } catch (e) {}
        if (pref === 'system') pref = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', pref === 'light' ? 'light' : 'dark');
      })();
    </script>
    <meta name="theme-color" content="#0a0d14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta property="og:image" content="/brand/recorion-logo-full-1280.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
