# İSTEK #750: Beyin AI web derin araştırması için kendi sunucumuzdaki meta arama motoru.
# Yalnız recorion_net içinden erişilir (port dışarı açılmaz). Gizli anahtar searxng/secret.env'den (SEARXNG_SECRET) gelir.
use_default_settings: true

general:
  instance_name: "RECOrion Arama"
  enable_metrics: false
  contact_url: "https://recdx.com"   # Wikipedia/Wikidata/OSM motorları iletişim adresi ister

server:
  limiter: false          # yalnız iç ağdan backend çağırır
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  default_lang: "tr-TR"
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0

engines:
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: google
    disabled: false
  - name: wikidata
    disabled: true
  - name: openstreetmap
    disabled: true
  - name: torch
    disabled: true
